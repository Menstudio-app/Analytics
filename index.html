/* Simple hand-rolled SVG line chart — no external charting library required */
function TrendChart({ data }) {
  const [hover, setHover] = useState(null);
  const width = 900, height = 220, padL = 46, padR = 12, padT = 10, padB = 28;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const values = data.map(d => d.earnings);
  const max = Math.ceil(Math.max(...values) / 500) * 500;
  const min = 0;
  const xStep = plotW / (data.length - 1);
  const yFor = (v) => padT + plotH - ((v - min) / (max - min)) * plotH;
  const xFor = (i) => padL + i * xStep;

  const points = data.map((d, i) => [xFor(i), yFor(d.earnings)]);
  const path = points.map((p, i) => (i === 0 ? "M" : "L") + p[0] + "," + p[1]).join(" ");
  const areaPath = path + ` L${points[points.length - 1][0]},${padT + plotH} L${points[0][0]},${padT + plotH} Z`;

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => min + f * (max - min));

  return (
    <div style={{ position: "relative" }}>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} style={{ display: "block", overflow: "visible" }}>
        {gridLines.map((g, i) => (
          <g key={i}>
            <line x1={padL} x2={width - padR} y1={yFor(g)} y2={yFor(g)} stroke="#1F1C25" strokeDasharray="3 3" />
            <text x={padL - 8} y={yFor(g) + 4} fill="#6E6780" fontSize="11" fontFamily="Inter, sans-serif" textAnchor="end">${g}</text>
          </g>
        ))}
        {data.map((d, i) => (
          <text key={i} x={xFor(i)} y={height - 6} fill="#6E6780" fontSize="11" fontFamily="Inter, sans-serif" textAnchor="middle">{d.day}</text>
        ))}
        <path d={areaPath} fill="#F5F3EC" opacity="0.06" />
        <path d={path} fill="none" stroke="#F5F3EC" strokeWidth="2" />
        {points.map((p, i) => (
          <circle
            key={i}
            cx={p[0]} cy={p[1]}
            r={hover === i ? 5 : 3}
            fill="#F5F3EC"
            style={{ cursor: "pointer" }}
            onMouseEnter={() => setHover(i)}
            onMouseLeave={() => setHover(null)}
          />
        ))}
      </svg>
      {hover !== null && (
        <div style={{
          position: "absolute",
          left: `calc(${(points[hover][0] / width) * 100}% - 50px)`,
          top: `${(points[hover][1] / height) * 100 - 18}%`,
          background: "#1F1C25", border: "1px solid #362F41", borderRadius: "4px",
          padding: "8px 10px", fontFamily: "Inter, sans-serif", pointerEvents: "none", whiteSpace: "nowrap",
        }}>
          <div style={{ color: "#9A93A8", fontSize: "11px", marginBottom: "3px" }}>{data[hover].day}</div>
          <div style={{ color: "#F5F3F7", fontSize: "12px" }}>${data[hover].earnings.toLocaleString()} earned</div>
        </div>
      )}
    </div>
  );
}

          </div>
          <div style={{ display: "flex", flexDirection: "column", justifyContent: "center" }}>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: "18px", color: "#F5F3F7", marginBottom: "10px" }}>{topVideo.title}</div>
            <div style={{ display: "flex", gap: "18px", fontFamily: "Inter, sans-serif", fontSize: "13px", color: "#6E6780" }}>
              <span>{topVideo.views} views</span>
              <span>{topVideo.likes} likes</span>
              <span style={{ color: "#F5F3EC" }}>{topVideo.earnings} earned</span>
            </div>
          </div>
        </div>

        {/* Stat cards */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "12px", marginBottom: "20px" }}>
          {stats.map((s) => <StatCard key={s.label} {...s} />)}
        </div>

        {/* Trend chart */}
        <div style={{ background: "#151319", borderRadius: "4px", padding: "20px 20px 8px", marginBottom: "20px" }}>
          <div style={{ fontFamily: "Inter, sans-serif", fontSize: "14px", color: "#F5F3F7", marginBottom: "14px" }}>Earnings over time</div>
          <TrendChart data={trend} />
        </div>

        {/* Breakdown panel */}
        <div style={{ background: "#151319", borderRadius: "4px", padding: "20px" }}>
          <div style={{ fontFamily: "Inter, sans-serif", fontSize: "14px", marginBottom: "16px" }}>How subscribers find you</div>
          {sources.map((s) => (
            <div key={s.label} style={{ marginBottom: "12px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "Inter, sans-serif", fontSize: "13px", color: "#C7C1D3", marginBottom: "5px" }}>
                <span>{s.label}</span>
                <span>{s.value}%</span>
              </div>
              <div style={{ background: "#1F1C25", borderRadius: "2px", height: "5px" }}>
                <div style={{ width: `${s.value}%`, background: "#F5F3EC", height: "100%", borderRadius: "2px" }} />
              </div>
            </div>
          ))}
        </div>

        {/* Footer */}
        <div style={{ marginTop: "24px", paddingTop: "16px", borderTop: "1px solid #1F1C25", textAlign: "center" }}>
          <a
            href="mailto:support.menstudio@gmail.com"
            style={{ fontFamily: "Inter, sans-serif", fontSize: "12px", color: "#6E6780", textDecoration: "none" }}
          >
            support.menstudio@gmail.com
          </a>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CreatorDashboard />);
</script>
</body>
</html>
