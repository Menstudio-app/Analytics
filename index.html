function ArrowUpRight({ size = 13, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <line x1="7" y1="17" x2="17" y2="7"></line>
      <polyline points="7 7 17 7 17 17"></polyline>
    </svg>
  );
}
function ArrowDownRight({ size = 13, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <line x1="7" y1="7" x2="17" y2="17"></line>
      <polyline points="17 7 17 17 7 17"></polyline>
    </svg>
  );
}
function Download({ size = 14, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <path d="M12 3v12"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <path d="M4 19h16"></path>
    </svg>
  );
}
function ChevronDown({ size = 14, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">

}

/* ---------- COMPONENTS ---------- */

function StatCard({ label, value, delta, up, sub }) {
  return (
    <div style={{ background: "#151319", borderTop: "2px solid #F5F3EC", borderRadius: "4px", padding: "18px 20px", minWidth: "0" }}>
      <div style={{ fontFamily: "Inter, sans-serif", fontSize: "13px", color: "#9A93A8" }}>{label}</div>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: "28px", fontWeight: 500, color: "#F5F3F7", marginTop: "6px", lineHeight: 1.1 }}>{value}</div>
      <div style={{ display: "flex", alignItems: "center", gap: "4px", marginTop: "8px", fontFamily: "Inter, sans-serif", fontSize: "12.5px", color: up ? "#4ADE80" : "#F87171" }}>
        {up ? <ArrowUpRight size={13} /> : <ArrowDownRight size={13} />}
        {Math.abs(delta)}%
        <span style={{ color: "#6E6780", marginLeft: "2px" }}>{sub}</span>
      </div>
    </div>
  );
}

/* Simple hand-rolled SVG line chart — no external charting library required */
function TrendChart({ data }) {
  const [hover, setHover] = useState(null);
  const width = 900, height = 220, padL = 46, padR = 12, padT = 10, padB = 28;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;
  const values = data.map(d => d.earnings);
  const max = Math.ceil(Math.max(...values) / 500) * 500;
  const min = 0;
  const xStep = plotW / (data.length - 1);
  const yFor = (v) => padT + plotH - ((v - min) / (max - min)) * plotH;
  const xFor = (i) => padL + i * xStep;

  const points = data.map((d, i) => [xFor(i), yFor(d.earnings)]);
  const path = points.map((p, i) => (i === 0 ? "M" : "L") + p[0] + "," + p[1]).join(" ");
  const areaPath = path + ` L${points[points.length - 1][0]},${padT + plotH} L${points[0][0]},${padT + plotH} Z`;

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => min + f * (max - min));

  return (
    <div style={{ position: "relative" }}>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} style={{ display: "block", overflow: "visible" }}>
        {gridLines.map((g, i) => (
          <g key={i}>
            <line x1={padL} x2={width - padR} y1={yFor(g)} y2={yFor(g)} stroke="#1F1C25" strokeDasharray="3 3" />
            <text x={padL - 8} y={yFor(g) + 4} fill="#6E6780" fontSize="11" fontFamily="Inter, sans-serif" textAnchor="end">${g}</text>
          </g>
        ))}
        {data.map((d, i) => (
          <text key={i} x={xFor(i)} y={height - 6} fill="#6E6780" fontSize="11" fontFamily="Inter, sans-serif" textAnchor="middle">{d.day}</text>
        ))}
        <path d={areaPath} fill="#F5F3EC" opacity="0.06" />
        <path d={path} fill="none" stroke="#F5F3EC" strokeWidth="2" />
        {points.map((p, i) => (
          <circle
            key={i}
            cx={p[0]} cy={p[1]}
            r={hover === i ? 5 : 3}
            fill="#F5F3EC"
            style={{ cursor: "pointer" }}
            onMouseEnter={() => setHover(i)}
            onMouseLeave={() => setHover(null)}
          />
        ))}
      </svg>
      {hover !== null && (
        <div style={{
          position: "absolute",
          left: `calc(${(points[hover][0] / width) * 100}% - 50px)`,
          top: `${(points[hover][1] / height) * 100 - 18}%`,
          background: "#1F1C25", border: "1px solid #362F41", borderRadius: "4px",
          padding: "8px 10px", fontFamily: "Inter, sans-serif", pointerEvents: "none", whiteSpace: "nowrap",
        }}>
          <div style={{ color: "#9A93A8", fontSize: "11px", marginBottom: "3px" }}>{data[hover].day}</div>
          <div style={{ color: "#F5F3F7", fontSize: "12px" }}>${data[hover].earnings.toLocaleString()} earned</div>
        </div>
      )}
    </div>
  );
}
